name: Go

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    name: Go Build
    runs-on: ubuntu-latest
    steps:
    - name: Set up Go 1.x
      uses: actions/setup-go@v7
      with:
        go-version: stable

    - name: Check out code into the Go module directory
      uses: actions/checkout@v7

    - name: Examples
      run: |
        cd examples/go
        go run ./search_product_recalls
        go run ./get_product_recall
        go run ./search_by_identifier

    - name: Test
      run: cd ./go/ && go test ./...
